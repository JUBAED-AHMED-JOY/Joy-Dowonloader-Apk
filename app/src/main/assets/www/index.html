<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JOY Video Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; padding: 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 18px 0 6px; position: relative; }
  header h1 { font-size: 22px; }
  header h1 span { color: #58a6ff; }
  .brand { color: #8b949e; font-size: 12px; margin-top: 4px; }
  .gear { position: absolute; right: 0; top: 18px; font-size: 22px; background: none; border: none; color: #8b949e; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 18px; margin-top: 14px; }
  input[type=text] { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 14px; margin-bottom: 10px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #238636; color: #fff; font-size: 16px; font-weight: 700; }
  .btn:active { background: #2ea043; }
  .btn:disabled { background: #30363d; color: #8b949e; }
  .platforms { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 12px 0 4px; }
  .platforms span { font-size: 11px; background: #21262d; border: 1px solid #30363d; padding: 5px 11px; border-radius: 20px; color: #8b949e; }
  .platforms span.on { color: #58a6ff; border-color: #58a6ff; }
  #settings { display: none; }
  #settings.open { display: block; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; margin-bottom: 0; }
  .row button { padding: 13px 18px; border: none; border-radius: 10px; background: #1f6feb; color: #fff; font-weight: 600; }
  .hint { font-size: 11px; color: #6e7681; margin-top: 8px; }
  #result { display: none; }
  #result.show { display: block; }
  .thumb { width: 100%; border-radius: 10px; margin-bottom: 10px; }
  .player { width: 100%; border-radius: 10px; margin-bottom: 10px; background: #000; max-height: 300px; }
  .title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .dlv { margin-bottom: 8px; }
  .dla { background: #1f6feb; margin-bottom: 4px; }
  .dla:active { background: #388bfd; }
  .media { display: flex; align-items: center; justify-content: space-between; background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .media .q { font-size: 13px; }
  .media .q b { color: #58a6ff; }
  .media .sz { font-size: 12px; color: #8b949e; }
  .dl { padding: 9px 16px; border: none; border-radius: 8px; background: #238636; color: #fff; font-weight: 700; font-size: 13px; }
  .err { color: #f85149; font-size: 13px; text-align: center; padding: 8px; }
  .loading { text-align: center; color: #8b949e; font-size: 13px; padding: 12px; }
  footer { text-align: center; margin-top: 22px; padding-bottom: 20px; }
  .contact-card { background: linear-gradient(145deg, #1a2e35, #243b43); border: 1px solid #30363d; border-radius: 16px; padding: 24px 16px; margin-bottom: 12px; }
  .contact-card .profile { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 5px solid #fff; margin-bottom: 12px; animation: popIn 0.8s ease; }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .contact-card h1 { font-size: 24px; letter-spacing: 2px; margin-bottom: 4px; }
  .contact-card .subtitle { color: #8b949e; font-size: 14px; margin-bottom: 18px; }
  .cbuttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .cbtn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 50px; text-decoration: none; color: #fff; font-size: 16px; font-weight: 700; box-shadow: 0 4px 10px #0005; }
  .cbtn:active { transform: scale(0.97); }
  .cbtn.whatsapp { background: #20ce69; }
  .cbtn.wpnum { flex-direction: column; gap: 2px; }
  .cbtn .wpn { font-size: 13px; font-weight: 600; opacity: 0.95; }
  .cbtn.telegram { background: #078dc9; }
  .cbtn.github { background: #24292e; border: 1px solid #30363d; }
  .location { margin: 18px 0 6px; font-size: 16px; font-weight: 700; animation: addrGlow 2.5s ease-in-out infinite; }
  .location .pin { display: inline-block; animation: pinBounce 1.6s ease-in-out infinite; }
  @keyframes addrGlow {
    0%, 100% { text-shadow: 0 0 4px #58a6ff66; transform: scale(1); }
    50% { text-shadow: 0 0 18px #58a6ff, 0 0 32px #58a6ff88; transform: scale(1.04); }
  }
  @keyframes pinBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .cdiv { border: 0; border-top: 1px dashed #526970; margin: 16px 0; }
  .contact-card h2 { color: #ffdf22; font-size: 18px; margin-bottom: 12px; }
  .skills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .skill { padding: 10px 16px; border: 2px solid #fff; border-radius: 50px; font-size: 13px; font-weight: 700; }
  .skill.js { background: linear-gradient(100deg, #ff786e, #ffad70); }
  .skill.html { background: #079ce7; }
  .skill.css { background: #f6a900; }
  .skill.node { background: #399a61; }
  footer .fl { display: flex; justify-content: center; gap: 14px; margin-bottom: 8px; }
  footer a { color: #58a6ff; font-size: 13px; text-decoration: none; }
  footer .fb { font-size: 11px; color: #6e7681; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 <span>JOY</span> Video Downloader</h1>
    <div class="brand">API by Joy Ahmed</div>
  </header>

  <div class="card">
    <input type="text" id="vurl" placeholder="Paste video link here…">
    <div class="platforms" id="chips">
      <span data-p="youtube">YouTube</span><span data-p="tiktok">TikTok</span><span data-p="facebook">Facebook</span><span data-p="instagram">Instagram</span><span data-p="twitter">Twitter/X</span><span data-p="terabox">Terabox</span>
    </div>
    <button class="btn" id="goBtn" onclick="fetchMedia()">⬇ Get Download Links</button>
  </div>

  <div class="card" id="result"></div>

  <footer>
    <div class="contact-card">
      <img src="profile.jpg" class="profile" alt="JOY AHMED">
      <h1>JOY AHMED</h1>
      <p class="subtitle">Connect with me</p>
      <div class="cbuttons">
        <a href="https://wa.me/8801709045888" class="cbtn whatsapp wpnum" target="_blank"><span>☏ WhatsApp</span><span class="wpn">+8801709045888</span></a>
        <a href="https://t.me/JOY_AHMED_88" class="cbtn telegram" target="_blank">➤ Telegram</a>
        <a href="https://github.com/JUBAED-AHMED-JOY" class="cbtn github" target="_blank">● GitHub</a>
      </div>
      <p class="location"><span class="pin">📍</span> Jamalpur, Dhaka, Bangladesh</p>
      <hr class="cdiv">
      <h2>🎁 SKILLS</h2>
      <div class="skills">
        <span class="skill js">JS JavaScript</span>
        <span class="skill html">▣ HTML</span>
        <span class="skill css">▣ CSS</span>
        <span class="skill node">⬡ Node.js</span>
      </div>
    </div>
    <div class="fb">JOY Video Downloader · API by Joy Ahmed</div>
  </footer>
</div>

<script>
const API = 'https://nayan-video-downloader.vercel.app/alldown?url=';
function detectPlatform(u) {
  u = u.toLowerCase();
  if (/youtu\.?be/.test(u)) return 'youtube';
  if (/tiktok/.test(u)) return 'tiktok';
  if (/facebook|fb\.watch|fb\.com/.test(u)) return 'facebook';
  if (/instagram/.test(u)) return 'instagram';
  if (/twitter|x\.com/.test(u)) return 'twitter';
  if (/terabox|1024terabox|mirrobox/.test(u)) return 'terabox';
  return null;
}
document.getElementById('vurl').addEventListener('input', e => {
  const p = detectPlatform(e.target.value);
  document.querySelectorAll('#chips span').forEach(s =>
    s.classList.toggle('on', s.dataset.p === p));
});
async function fetchMedia() {
  const vurl = document.getElementById('vurl').value.trim();
  const box = document.getElementById('result');
  if (!vurl) { alert('Paste a video link first'); return; }
  const btn = document.getElementById('goBtn');
  btn.disabled = true;
  box.className = 'card show';
  box.innerHTML = '<div class="loading">⏳ Fetching…</div>';
  try {
    const r = await fetch(API + encodeURIComponent(vurl));
    const d = await r.json();
    const info = d && d.data;
    if (!d || d.status !== true || !info || (!info.high && !info.low)) {
      box.innerHTML = '<div class="err">❌ No video found for that link.</div>';
      btn.disabled = false;
      return;
    }
    const vUrl = info.high || info.low;
    const aUrl = info.low || info.high;
    const esc = s => String(s || '').replace(/'/g, "\\'");
    let html = '';
    html += '<video class="player" controls preload="metadata" src="' + vUrl + '"></video>';
    html += '<div class="title">' + String(info.title || 'Video').replace(/</g, '&lt;') + '</div>';
    html += '<button class="btn dlv" onclick="dl(\'' + esc(vUrl) + '\')">⬇ Download Video</button>';
    html += '<button class="btn dla" onclick="dl(\'' + esc(aUrl) + '\')">🎵 Download Audio (Low)</button>';
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="err">❌ Could not fetch video. Check your internet and try again.</div>';
  }
  btn.disabled = false;
}
function dl(url) { window.location.href = url; }
</script>
</body>
</html>
